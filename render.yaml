# Optional. Render's declarative infrastructure config.
# Set secret values in the Render dashboard.

services:
  - type: web
    name: growmate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false

  - type: web
    name: growmate-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    numInstances: 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_PATH
        value: /data/growmate.db
      - key: OLLAMA_URL
        value: http://localhost:11434
      - key: CORS_ORIGINS
        sync: false
      - key: OLLAMA_TIMEOUT
        value: "180"
      - key: SENTRY_DSN
        sync: false
      - key: SERPAPI_KEY
        sync: false
    disk:
      name: growmate-data
      mountPath: /data
      sizeGB: 1